<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Prices — KisanSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<nav class="navbar navbar-expand-lg kisansetu-nav"><div class="container">
<a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop me-1" aria-hidden="true"></i>KisanSetu</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" data-nav="market" href="market.html">Market</a></li>
<li class="nav-item"><a class="nav-link" href="farmers.html">Farmers</a></li>
<li class="nav-item"><a class="nav-link" href="buyers.html">Buyers</a></li>
</ul>
<span class="location-pill"><span id="location-label"><i class="bi bi-geo-alt" aria-hidden="true"></i> Set location</span><button type="button" onclick="LocationSvc.showManual()">Change</button></span>
<ul class="navbar-nav ms-2" id="nav-auth"></ul>
</div></div></nav>
<main class="container py-4" id="main">
<h1 class="h3">Market Prices <span class="badge badge-demo">Demo data</span></h1>
<div class="card p-3 mb-3">
<div class="row g-2">
<div class="col-md-4"><label class="form-label" for="q">Search crop</label><input id="q" class="form-control" placeholder="e.g. Tomato / Aloo" list="crops"><datalist id="crops"></datalist></div>
<div class="col-md-3"><label class="form-label" for="cat">Category</label><select id="cat" class="form-select"><option value="">All</option><option>vegetable</option><option>grain</option><option>fruit</option><option>spice</option><option>oilseed</option><option>cash</option></select></div>
<div class="col-md-3"><label class="form-label" for="sort">Sort by</label><select id="sort" class="form-select"><option value="name">Name</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="trend">Trend</option></select></div>
<div class="col-md-2 d-flex align-items-end"><button class="btn btn-kisansetu w-100" id="go">Go</button></div>
</div>
</div>
<div class="crop-grid" id="grid"></div>
</main>
<div class="modal fade" id="location-modal" tabindex="-1" aria-label="Choose location"><div class="modal-dialog"><div class="modal-content">
<div class="modal-header"><h3 class="h5">Choose location</h3><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
<div class="modal-body">
<div class="mb-2"><label class="form-label" for="loc-state">State</label><select id="loc-state" class="form-select"></select></div>
<div class="mb-2"><label class="form-label" for="loc-dist">District</label><select id="loc-dist" class="form-select"></select></div>
<div class="mb-2"><label class="form-label" for="loc-city">City</label><select id="loc-city" class="form-select"></select></div>
</div><div class="modal-footer"><button class="btn btn-kisansetu" id="loc-save">Save</button></div>
</div></div></div>
<footer class="kisansetu-footer"><div class="container"><span class="demo-note">Showing sample/demo data</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/location.js"></script>
<script src="js/main.js"></script>
<script>
App.paintNav("market"); LocationSvc.detect(); LocationSvc.wireModal("loc-state","loc-dist","loc-city","loc-save");
document.getElementById("q").value = App.q("q") || App.q("crop") || "";
App.wireSearch("q", "crops");
async function paint() {
  const q = document.getElementById("q").value;
  const cat = document.getElementById("cat").value;
  const sort = document.getElementById("sort").value;
  let rows = await Api.getMarketPrices({ crop: q });
  if (cat) {
    const names = new Set(MockDB.crops.filter(c => c.category === cat).map(c => c.name));
    rows = rows.filter(r => names.has(r.crop));
  }
  if (sort === "low") rows.sort((a,b) => a.per_kg - b.per_kg);
  else if (sort === "high") rows.sort((a,b) => b.per_kg - a.per_kg);
  else if (sort === "trend") rows.sort((a,b) => Math.abs(b.trend_pct) - Math.abs(a.trend_pct));
  else rows.sort((a,b) => a.crop.localeCompare(b.crop));
  document.getElementById("grid").innerHTML = rows.map(r => {
    const t = r.trend_pct >= 3 ? `<span class="trend-up"><i class="bi bi-arrow-up-circle-fill" aria-hidden="true"></i> Rising</span>` : r.trend_pct <= -3 ? `<span class="trend-down"><i class="bi bi-arrow-down-circle-fill" aria-hidden="true"></i> Falling</span>` : `<span class="trend-flat"><i class="bi bi-dash-circle" aria-hidden="true"></i> Stable</span>`;
    return `<div class="crop-card"><a href="crop.html?crop=${encodeURIComponent(r.crop)}">
      <h3>${r.crop}</h3><div class="price-big">₹${r.per_kg}/kg</div><div>${t}</div>
      <div class="price-meta">${r.district}, ${r.state} · Updated ${App.timeAgo(r.recorded_at)}</div></a></div>`;
  }).join("") || `<p>No crops found. Try "Aloo".</p>`;
}
document.getElementById("go").onclick = paint;
["q","cat","sort"].forEach(id => document.getElementById(id).addEventListener("change", paint));
paint();
</script>
</body>
</html>
