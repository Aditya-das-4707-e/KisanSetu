<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Alerts — KisanSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<nav class="navbar navbar-expand-lg kisansetu-nav"><div class="container">
<a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop me-1" aria-hidden="true"></i>KisanSetu</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" href="market.html">Market</a></li>
<li class="nav-item"><a class="nav-link" href="farmers.html">Farmers</a></li>
<li class="nav-item"><a class="nav-link" href="buyers.html">Buyers</a></li>
</ul>
<ul class="navbar-nav ms-auto" id="nav-auth"></ul>
</div></div></nav>
<main class="container py-4" id="main">
<h1 class="h3">Price Alerts <span class="badge badge-demo">Demo (browser only)</span></h1>
<div class="row">
<div class="col-lg-5 mb-3"><div class="card p-3">
<h2 class="h5">Create New Alert</h2>
<div class="mb-2"><label class="form-label" for="n-crop">Crop</label><select id="n-crop" class="form-select"></select></div>
<div class="mb-2"><label class="form-label" for="n-loc">Location</label><input id="n-loc" class="form-control" placeholder="e.g. Kolkata"></div>
<div class="mb-2"><label class="form-label" for="n-cond">Tell me when price is…</label><select id="n-cond" class="form-select"><option value="above">Above ₹ (per kg)</option><option value="below">Below ₹ (per kg)</option><option value="pct_increase">Rises by % or more</option><option value="pct_decrease">Falls by % or more</option></select></div>
<div class="mb-2"><label class="form-label" for="n-val">Value (₹/kg or %)</label><input id="n-val" type="number" step="0.01" min="0" class="form-control"></div>
<fieldset class="mb-2"><legend class="form-label">How should we tell you?</legend>
<div class="form-check"><input id="ch-app" type="checkbox" class="form-check-input" checked><label class="form-check-label" for="ch-app">In-app message</label></div>
<div class="form-check"><input id="ch-email" type="checkbox" class="form-check-input"><label class="form-check-label" for="ch-email">Email</label></div>
</fieldset>
<button class="btn btn-kisansetu w-100" id="create">Create alert</button>
</div></div>
<div class="col-lg-7"><h2 class="h5">Your alerts</h2><div id="list"></div></div>
</div>
</main>
<footer class="kisansetu-footer"><div class="container"><span class="demo-note">Showing sample/demo data</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/validation.js"></script>
<script src="js/main.js"></script>
<script>
App.paintNav("alerts");
document.getElementById("n-crop").innerHTML = MockDB.crops.map(c => `<option>${c.name}</option>`).join("");
async function paint() {
  const list = await Api.getAlerts();
  document.getElementById("list").innerHTML = list.length ? list.map(a =>
    `<div class="card p-3 mb-2 d-flex flex-row justify-content-between align-items-center gap-2">
    <div><strong>${a.crop}</strong> — ${a.condition} ${a.threshold} <small class="price-meta">${a.location || ""} · ${(a.channel || []).join(", ")}</small><br>
    <span class="badge ${a.active ? "bg-success" : "bg-secondary"}">${a.active ? "Active" : "Paused"}</span></div>
    <div class="d-flex gap-1">
    <button class="btn btn-sm btn-outline-secondary" onclick="toggleA('${a.id}')">${a.active ? "Pause" : "Resume"}</button>
    <button class="btn btn-sm btn-danger" onclick="delA('${a.id}')">Delete</button></div></div>`).join("")
    : `<div class="card p-4 text-center"><p class="mb-0">You don't have any price alerts yet. Create one to get notified of price changes.</p></div>`;
}
window.delA = async (id) => { await Api.deleteAlert(id); paint(); };
window.toggleA = async (id) => {
  const list = await Api.getAlerts();
  const it = list.find(a => String(a.id) === String(id));
  if (it) it.active = !it.active;
  localStorage.setItem("kisansetu_alerts", JSON.stringify(list));
  paint();
};
document.getElementById("create").onclick = async () => {
  const val = document.getElementById("n-val").value;
  if (!Validate.field("n-val", +val > 0, "Enter a value above 0")) return;
  const ch = [];
  if (document.getElementById("ch-app").checked) ch.push("in-app");
  if (document.getElementById("ch-email").checked) ch.push("email");
  await Api.createAlert({ crop: document.getElementById("n-crop").value, location: document.getElementById("n-loc").value, condition: document.getElementById("n-cond").value, threshold: +val, channel: ch });
  document.getElementById("n-val").value = "";
  paint();
};
paint();
</script>
</body>
</html>
