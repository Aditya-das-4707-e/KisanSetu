<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — KisanSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<nav class="navbar navbar-expand-lg kisansetu-nav"><div class="container">
<a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop me-1" aria-hidden="true"></i>KisanSetu</a>
<div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto" id="nav-auth"></ul></div>
</div></nav>
<main class="container py-4" id="main">
<div class="row justify-content-center"><div class="col-md-5"><div class="card p-4">
<h1 class="h3">Welcome back</h1>
<p class="price-meta">Demo login only — no real account is checked.</p>
<form id="form" novalidate>
<div class="mb-2"><label class="form-label" for="login-id">Email or Phone</label><input id="login-id" class="form-control" autocomplete="username" required></div>
<div class="mb-2"><label class="form-label" for="login-pw">Password</label><input id="login-pw" type="password" class="form-control" autocomplete="current-password" required></div>
<button class="btn btn-kisansetu w-100" type="submit">Login</button>
</form>
<p class="mt-3 mb-0"><a href="register.html">Create an account</a> · <a href="profile.html">Forgot password? (demo)</a></p>
</div></div></div>
</main>
<footer class="kisansetu-footer"><div class="container"><span class="demo-note">Showing sample/demo data</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/validation.js"></script>
<script src="js/main.js"></script>
<script>
App.paintNav("login");
document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const id = document.getElementById("login-id").value.trim();
  const pw = document.getElementById("login-pw").value;
  let ok = true;
  ok = Validate.required("login-id", "Enter your email or phone") && ok;
  ok = Validate.required("login-pw", "Enter your password") && ok;
  if (!ok) return;
  const role = /buyer|mart|trader/i.test(id) ? "buyer" : "farmer";
  localStorage.setItem("kisansetu_user", JSON.stringify({ name: id.split("@")[0] || "Demo User", email: id, role }));
  location.href = role === "buyer" ? "dashboard-buyer.html" : "dashboard-farmer.html";
});
</script>
</body>
</html>
