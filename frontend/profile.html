<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — KisanSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<nav class="navbar navbar-expand-lg kisansetu-nav"><div class="container">
<a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop me-1" aria-hidden="true"></i>KisanSetu</a>
<div class="collapse navbar-collapse"><ul class="navbar-nav ms-auto" id="nav-auth"></ul></div>
</div></nav>
<main class="container py-4" id="main">
<div class="row justify-content-center"><div class="col-md-7"><div class="card p-4">
<h1 class="h3">Your Profile</h1>
<p class="price-meta">Role: <strong id="role">farmer</strong> (role cannot be self-changed after verification — demo).</p>
<div class="row">
<div class="col-md-6 mb-2"><label class="form-label" for="p-name">Full name</label><input id="p-name" class="form-control"></div>
<div class="col-md-6 mb-2"><label class="form-label" for="p-phone">Phone</label><input id="p-phone" class="form-control"></div>
<div class="col-md-4 mb-2"><label class="form-label" for="p-state">State</label><input id="p-state" class="form-control"></div>
<div class="col-md-4 mb-2"><label class="form-label" for="p-dist">District</label><input id="p-dist" class="form-control"></div>
<div class="col-md-4 mb-2"><label class="form-label" for="p-city">City / Village</label><input id="p-city" class="form-control"></div>
<div class="col-12 mb-2"><label class="form-label" for="p-addr">Address</label><textarea id="p-addr" class="form-control"></textarea></div>
</div>
<button class="btn btn-kisansetu" id="save">Save changes (demo)</button>
<p class="price-meta mt-3 mb-0"><i class="bi bi-shield-lock me-1" aria-hidden="true"></i>Your exact address and contact details are never shown publicly. Listings show only approximate locality.</p>
</div></div></div>
</main>
<footer class="kisansetu-footer"><div class="container"><span class="demo-note">Showing sample/demo data</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/validation.js"></script>
<script src="js/main.js"></script>
<script>
App.paintNav("profile");
const u = App.user() || { name: "Demo Farmer", email: "demo@kisansetu.local", role: "farmer" };
document.getElementById("role").textContent = u.role;
document.getElementById("p-name").value = u.name || "";
document.getElementById("p-phone").value = u.phone || "";
document.getElementById("p-state").value = u.state || "West Bengal";
document.getElementById("p-dist").value = u.district || "Kolkata";
document.getElementById("p-city").value = u.city || "New Market";
document.getElementById("save").onclick = () => {
  if (!Validate.required("p-name")) return;
  localStorage.setItem("kisansetu_user", JSON.stringify({ ...u, name: document.getElementById("p-name").value }));
  alert("Saved in this browser (demo). No server was contacted.");
};
</script>
</body>
</html>
