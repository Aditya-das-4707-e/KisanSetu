<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nearby Farmers — KisanSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<nav class="navbar navbar-expand-lg kisansetu-nav"><div class="container">
<a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop me-1" aria-hidden="true"></i>KisanSetu</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" href="market.html">Market</a></li>
<li class="nav-item"><a class="nav-link" data-nav="farmers" href="farmers.html">Farmers</a></li>
<li class="nav-item"><a class="nav-link" href="buyers.html">Buyers</a></li>
</ul>
<ul class="navbar-nav ms-auto" id="nav-auth"></ul>
</div></div></nav>
<main class="container py-4" id="main">
<h1 class="h3">Nearby Farmers <span class="badge badge-demo">Demo data</span></h1>
<p class="price-meta">Only approximate localities are shown — never exact addresses.</p>
<div class="card p-3 mb-3"><div class="row g-2">
<div class="col-md-3"><label class="form-label" for="f-crop">Crop</label><input id="f-crop" class="form-control" placeholder="e.g. Tomato"></div>
<div class="col-md-2"><label class="form-label" for="f-dist">Max distance (km)</label><input id="f-dist" type="number" class="form-control"></div>
<div class="col-md-2"><label class="form-label" for="f-price">Max price (₹/kg)</label><input id="f-price" type="number" class="form-control"></div>
<div class="col-md-2"><label class="form-label" for="f-ver">Verified</label><select id="f-ver" class="form-select"><option value="">All</option><option value="1">Verified only</option></select></div>
<div class="col-md-3 d-flex align-items-end"><button class="btn btn-kisansetu w-100" id="go">Filter</button></div>
</div></div>
<div class="crop-grid" id="grid"></div>
</main>
<div class="modal fade" id="detail-modal" tabindex="-1" aria-label="Listing details"><div class="modal-dialog"><div class="modal-content">
<div class="modal-header"><h3 class="h5" id="d-title">Details</h3><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
<div class="modal-body" id="d-body"></div>
</div></div></div>
<footer class="kisansetu-footer"><div class="container"><span class="demo-note">Showing sample/demo data</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
App.paintNav("farmers");
document.getElementById("f-crop").value = App.q("crop") || "";
async function paint() {
  const rows = await Api.getNearbyFarmers(document.getElementById("f-crop").value || undefined, {
    maxDistance: document.getElementById("f-dist").value || undefined,
    maxPrice: document.getElementById("f-price").value || undefined,
    verifiedOnly: document.getElementById("f-ver").value === "1"
  });
  document.getElementById("grid").innerHTML = rows.map(r =>
    `<div class="crop-card"><h3>${r.name} ${r.verified ? `<span class="badge bg-success">Verified Farmer</span>` : ""}</h3>
    <div><strong>${r.crop}</strong> · ${r.quantity_kg} kg @ <span class="price-big" style="font-size:1.25rem">₹${r.price_per_kg}/kg</span></div>
    <div class="price-meta">${r.locality}, ${r.district} · ${r.distance_km} km away</div>
    <button class="btn btn-outline-success btn-sm mt-2" onclick='showDetail(${JSON.stringify(r).replace(/'/g, "&#39;")})'>View Details</button></div>`).join("")
    || `<p>No farmers found for these filters.</p>`;
}
window.showDetail = (r) => {
  document.getElementById("d-title").textContent = `${r.name} — ${r.crop}`;
  document.getElementById("d-body").innerHTML = `<p><strong>Quantity:</strong> ${r.quantity_kg} kg<br><strong>Price:</strong> ₹${r.price_per_kg}/kg<br><strong>Area:</strong> ${r.locality}, ${r.district} (approximate)<br><strong>Distance:</strong> ${r.distance_km} km<br><strong>Contact:</strong> ${r.shared_contact ? "Shared in demo" : "Not shared — use the app to connect (demo)."}</p><p class="price-meta">Exact home addresses are never shown.</p>`;
  new bootstrap.Modal(document.getElementById("detail-modal")).show();
};
document.getElementById("go").onclick = paint;
paint();
</script>
</body>
</html>
